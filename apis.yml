aid: calvis
name: Calvis
description: Calvis is a multi-agency security guard marketplace that connects businesses
  with vetted, state-licensed, background-checked security guards from multiple professional
  agencies across 40+ US cities. Founded in 2023 and headquartered in Miami, Florida, the
  platform pairs on-demand booking with AI-powered deployment matching, real-time GPS
  tracking and geofencing, live AI coaching delivered to guards through an earpiece, and
  automated incident reporting and site analytics. Businesses book unarmed, armed, event,
  retail, construction, corporate, residential, hospital, cannabis, and school security
  through the web platform and iOS/Android apps, while security professionals join the
  network to find work. Calvis is backed by Version One Ventures.
